name: Deploy yggdrasil-service

env:
  IMAGE: ${{ vars.DOCKER_IMAGE }}

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build image
        run: |
          docker build -t "$IMAGE" .

      - name: 📤 Push image
        run: |
          docker push "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            IMAGE="${{ env.IMAGE }}"

            # Залогиниться в GHCR на сервере
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} || true

            # Подтянуть новый образ
            docker pull "$IMAGE"

            # Остановить и удалить старый контейнер (если есть)
            docker stop yggdrasil-service || true
            docker rm yggdrasil-service || true

            # Запустить контейнер с теми же портами и именем, что в docker-compose
            # Подключение тома: предполагается, что на сервере путь /home/${{ secrets.SERVER_USER }}/GitRepo/Yggdrasil/DataStorage/calendar существует
            docker run -d \
              --name yggdrasil-service \
              --restart unless-stopped \
              -p 8090:8080 \
              -v /home/${{ secrets.SERVER_USER }}/GitRepo/Yggdrasil/DataStorage/calendar:/data/calendar \
              "$IMAGE"