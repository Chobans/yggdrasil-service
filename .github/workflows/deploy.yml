name: Deploy yggdrasil-service

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
  
            cd /home/${{ secrets.SERVER_USER }}/GitRepo/Yggdrasil/yggdrasil-service
  
            # гарантированно взять последнюю ветку master
            git fetch --all
            git reset --hard origin/master
  
            # если на сервере в этом каталоге есть docker-compose файл — использовать docker compose
            if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
              echo "🐳 Deploy with docker compose"
              docker compose -f docker-compose.yml pull --ignore-pull-failures || true
              docker compose -f docker-compose.yml up -d --build --remove-orphans
            else
              echo "🐳 Build Docker image and run container"
              docker build -t yggdrasil-service:latest .
            
              docker stop yggdrasil-service || true
              docker rm yggdrasil-service || true
            
              docker run -d \
              --name yggdrasil-service \
              -p 8090:8080 \
              yggdrasil-service:latest
            fi